name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
    # El backend vive en express/ y se despliega en Vercel, no en Pages.
    # Ignorarlo evita redesplegar el frontend por cambios solo de backend.
    paths-ignore:
      - 'express/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite un único despliegue concurrente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Se asocia al environment github-pages para poder leer su variable
    # VITE_API_URL (definida en Settings > Environments > github-pages).
    environment: github-pages
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el proyecto
        run: npm run build
        env:
          # URL pública del backend en Vercel. Se define como variable del
          # repositorio (Settings > Secrets and variables > Actions > Variables).
          # Si no está definida, el frontend usa el backend local por defecto.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
